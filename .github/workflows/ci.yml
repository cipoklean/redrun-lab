name: ci

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LAB_RUN_MODE: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: test
        run: python -m pytest -q
